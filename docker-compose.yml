# =============================================================================
# College Hub - LOCAL DEVELOPMENT ONLY (MS-54)
#
# This Compose file provisions LOCAL-DEVELOPMENT infrastructure dependencies
# (PostgreSQL, Redis, MinIO, Mailpit) only. It is NOT a production topology.
#
# Production and staging deployments are managed EXCLUSIVELY via Kubernetes:
#   Helm chart:  infra/helm/collegehub
#   Rendered:    infra/k8s/render/<dev|staging|prod>/all.yaml
#   Validation:  .github/workflows/deploy-validation.yml
#
# See: docs/ms-54-production-deployment-platform.md
# =============================================================================
version: '3.8'

networks:
  collegehub_net:
    driver: bridge

volumes:
  collegehub_postgres_data:
    driver: local
  collegehub_redis_data:
    driver: local
  collegehub_minio_data:
    driver: local

services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: collegehub_postgres
    restart: unless-stopped
    networks:
      - collegehub_net
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-collegehub_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-collegehub_password}
      POSTGRES_DB: ${POSTGRES_DB:-collegehub_db}
    volumes:
      - collegehub_postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: '2.0'
          memory: 2048M
        reservations:
          memory: 512M
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-collegehub_user} -d ${POSTGRES_DB:-collegehub_db}"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 10s

  redis:
    image: redis:7-alpine
    container_name: collegehub_redis
    restart: unless-stopped
    networks:
      - collegehub_net
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --requirepass "${REDIS_PASSWORD:-}"
    volumes:
      - collegehub_redis_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 512M
        reservations:
          memory: 128M
    healthcheck:
      test: ["CMD-SHELL", "redis-cli ping | grep PONG"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  minio:
    image: minio/minio:RELEASE.2024-05-28T17-19-04Z
    container_name: collegehub_minio
    restart: unless-stopped
    networks:
      - collegehub_net
    ports:
      - "${MINIO_PORT:-9000}:9000"
      - "${MINIO_CONSOLE_PORT:-9001}:9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY_ID:-minioadmin}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - collegehub_minio_data:/data
    deploy:
      resources:
        limits:
          cpus: '1.0'
          memory: 1024M
        reservations:
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  mailpit:
    image: axllent/mailpit:v1.18
    container_name: collegehub_mailpit
    restart: unless-stopped
    networks:
      - collegehub_net
    ports:
      - "${MAILPIT_UI_PORT:-8025}:8025"   # Web UI
      - "${MAILPIT_SMTP_PORT:-1025}:1025" # SMTP Port
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8025/api/v1/info"]
      interval: 5s
      timeout: 5s
      retries: 5
      start_period: 5s

  # ===========================================================================
  # Observability stack (MS-55). Activate with:
  #   docker compose --profile observability up -d
  # Scrapes the API (:4000) and worker (:4100) /metrics endpoints on the host,
  # provisions Grafana with the 7 College Hub dashboards, and forwards OTLP
  # traces from the host to the local collector.
  # Config files: infra/observability/compose/*
  # ===========================================================================
  prometheus:
    image: prom/prometheus:v2.53.0
    container_name: collegehub_prometheus
    profiles: ["observability"]
    restart: unless-stopped
    networks:
      - collegehub_net
    ports:
      - "${PROMETHEUS_PORT:-9090}:9090"
    command:
      - --config.file=/etc/prometheus/prometheus.yml
    volumes:
      - ./infra/observability/compose/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    extra_hosts:
      - "host.docker.internal:host-gateway"
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  grafana:
    image: grafana/grafana:11.1.0
    container_name: collegehub_grafana
    profiles: ["observability"]
    restart: unless-stopped
    networks:
      - collegehub_net
    ports:
      - "${GRAFANA_PORT:-3001}:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
      GF_USERS_ALLOW_SIGN_UP: "false"
    volumes:
      - ./infra/observability/compose/grafana-datasources.yml:/etc/grafana/provisioning/datasources/datasources.yml:ro
      - ./infra/observability/compose/grafana-dashboards.yml:/etc/grafana/provisioning/dashboards/dashboards.yml:ro
      - ./infra/helm/collegehub/dashboards:/etc/grafana/dashboards:ro
    depends_on:
      - prometheus
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 512M

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.105.0
    container_name: collegehub_otel_collector
    profiles: ["observability"]
    restart: unless-stopped
    networks:
      - collegehub_net
    ports:
      - "4317:4317" # OTLP gRPC
      - "4318:4318" # OTLP HTTP
    volumes:
      - ./infra/observability/compose/otel-collector.yml:/etc/otelcol/config.yaml:ro
    deploy:
      resources:
        limits:
          cpus: '0.5'
          memory: 256M
