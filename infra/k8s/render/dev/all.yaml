# Source: collegehub/templates/migrations-job.yaml
apiVersion: batch/v1
kind: Job
metadata:
  name: collegehub-migrations
  namespace: collegehub-dev
  labels:
    
    helm.sh/chart: collegehub-1.0.0
    app.kubernetes.io/name: collegehub
    app.kubernetes.io/instance: collegehub
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: "migrations"
  annotations:
    "helm.sh/hook": pre-install,pre-upgrade
    "helm.sh/hook-weight": "-5"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 4
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        
        app.kubernetes.io/name: collegehub
        app.kubernetes.io/instance: collegehub
        app.kubernetes.io/component: "migrations"
    spec:
      restartPolicy: OnFailure
      serviceAccountName: collegehub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: migrations
          image: ghcr.io/college-hub/collegehub-api:dev
          imagePullPolicy: IfNotPresent
          workingDir: /app/packages/database
          command:
            - /bin/sh
            - -ec
            - |
              if [ -d migrations ]; then
                node dist/migrator.js
              else
                echo "No migration artifacts found; skipping database migration."
              fi
          envFrom:
            - configMapRef:
                name: collegehub-config
            - secretRef:
                name: collegehub-secret
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
