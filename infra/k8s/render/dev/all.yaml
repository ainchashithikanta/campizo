# Source: collegehub/templates/api-deployment.yaml
apiVersion: apps/v1
kind: Deployment
metadata:
  name: collegehub-api
  namespace: collegehub-dev
  labels:
    
    helm.sh/chart: collegehub-1.0.0
    app.kubernetes.io/name: collegehub
    app.kubernetes.io/instance: collegehub
    app.kubernetes.io/version: "dev"
    app.kubernetes.io/managed-by: Helm
    app.kubernetes.io/component: "api"
spec:
  replicas: 1
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      
      app.kubernetes.io/name: collegehub
      app.kubernetes.io/instance: collegehub
      app.kubernetes.io/component: "api"
  template:
    metadata:
      labels:
        
        app.kubernetes.io/name: collegehub
        app.kubernetes.io/instance: collegehub
        app.kubernetes.io/component: "api"
    spec:
      serviceAccountName: collegehub
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        fsGroup: 1001
      containers:
        - name: api
          image: ghcr.io/college-hub/collegehub-api:dev
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 4000
              protocol: TCP
          envFrom:
            - configMapRef:
                name: collegehub-config
            - secretRef:
                name: collegehub-secret
          env:
            - name: SERVICE_NAME
              value: "college-hub"
          resources:
            limits:
              cpu: "1"
              memory: 1Gi
            requests:
              cpu: 250m
              memory: 512Mi
          livenessProbe:
            httpGet:
              path: /health/live
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          readinessProbe:
            httpGet:
              path: /health/ready
              port: http
            initialDelaySeconds: 5
            periodSeconds: 5
            timeoutSeconds: 3
            failureThreshold: 3
