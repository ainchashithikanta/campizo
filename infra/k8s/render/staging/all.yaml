# Source: collegehub/templates/observability/prometheusrules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: collegehub-process
  namespace: "collegehub-staging"
  labels:
    app.kubernetes.io/name: collegehub
    app.kubernetes.io/part-of: collegehub-observability
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: collegehub-process
      rules:
        - alert: CollegeHubEventLoopLagHigh
          expr: |
            max(nodejs_eventloop_lag_seconds) by (service) > 1
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "College Hub event loop lag above 1s"
            description: "Service {{ $labels.service }} event loop is blocked for {{ $value }}s. Look for synchronous work or unbounded CPU loops."

        - alert: CollegeHubHeapUsageHigh
          expr: |
            max(nodejs_heap_size_used_bytes / nodejs_heap_size_total_bytes) by (service) > 0.9
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "College Hub Node.js heap usage above 90%"
            description: "Service {{ $labels.service }} heap is {{ $value | humanizePercentage }} full. Investigate memory leaks or growing caches."

        - alert: CollegeHubProcessRestarting
          expr: |
            changes(process_start_time_seconds[15m]) > 2
          for: 0m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "College Hub process restarting repeatedly"
            description: "Process on {{ $labels.instance }} has restarted more than twice in 15 minutes (crash loop)."
---
# Source: collegehub/templates/observability/prometheusrules.yaml
apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: collegehub-worker
  namespace: "collegehub-staging"
  labels:
    app.kubernetes.io/name: collegehub
    app.kubernetes.io/part-of: collegehub-observability
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: collegehub-worker
      rules:
        - alert: CollegeHubWorkerDown
          expr: |
            up{job="collegehub-worker"} == 0
          for: 1m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: "College Hub worker is down"
            description: "{{ $labels.instance }} has been unreachable for more than 1 minute."

        - alert: CollegeHubJobFailureRateHigh
          expr: |
            sum(rate(collegehub_jobs_total{result="failure"}[5m])) by (service)
              /
            clamp_min(sum(rate(collegehub_jobs_total[5m])) by (service), 1e-9) > 0.1
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "College Hub job failure rate above 10%"
            description: "Service {{ $labels.service }} is failing {{ $value | humanizePercentage }} of background jobs. Check `collegehub_jobs_total` by job label."

        - alert: CollegeHubJobDurationP99High
          expr: |
            histogram_quantile(0.99,
              sum(rate(collegehub_job_duration_seconds_bucket[5m])) by (le, service)) > 30
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "College Hub job p99 duration above 30s"
            description: "p99 background job duration for {{ $labels.service }} is {{ $value }}s."

        - alert: CollegeHubJobsStuckInFlight
          expr: |
            sum(collegehub_jobs_in_flight) by (service) > 20
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: "College Hub background jobs appear stuck"
            description: "Service {{ $labels.service }} has had {{ $value }} jobs in flight for 15 minutes; the worker may be hung or retrying a poison message."
