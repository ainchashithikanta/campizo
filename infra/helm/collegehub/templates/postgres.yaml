{{- if .Values.postgresql.enabled }}
{{- $walEnabled := and .Values.backup.enabled .Values.backup.postgres.wal.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ include "collegehub.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "collegehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  type: ClusterIP
  clusterIP: None
  selector:
    app.kubernetes.io/name: postgres
    app.kubernetes.io/instance: {{ .Release.Name }}
  ports:
    - name: postgres
      port: {{ .Values.postgresql.port }}
      targetPort: postgres
      protocol: TCP
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "collegehub.fullname" . }}-postgres
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "collegehub.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres
spec:
  serviceName: {{ include "collegehub.fullname" . }}-postgres
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: postgres
        app.kubernetes.io/instance: {{ .Release.Name }}
    spec:
      {{- with .Values.postgresql.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.postgresql.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      securityContext:
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
      containers:
        - name: postgres
          image: {{ .Values.postgresql.image }}
          ports:
            - name: postgres
              containerPort: {{ .Values.postgresql.port }}
              protocol: TCP
          {{- if $walEnabled }}
          command:
            - postgres
            - -c
            - archive_mode=on
            - -c
            - archive_command=cp %p {{ .Values.backup.postgres.wal.dir | default "/wal-archive" }}/%f
            - -c
            - archive_timeout={{ .Values.backup.postgres.wal.archiveTimeoutSeconds | default 60 }}
          {{- end }}
          env:
            - name: POSTGRES_USER
              value: {{ .Values.postgresql.auth.username }}
            - name: POSTGRES_PASSWORD
              value: {{ .Values.postgresql.auth.password }}
            - name: POSTGRES_DB
              value: {{ .Values.postgresql.auth.database }}
            - name: PGDATA
              value: /var/lib/postgresql/data/pgdata
          volumeMounts:
            - name: data
              mountPath: /var/lib/postgresql/data
            {{- if $walEnabled }}
            - name: wal-archive
              mountPath: {{ .Values.backup.postgres.wal.dir | default "/wal-archive" }}
            {{- end }}
          resources:
            {{- toYaml .Values.postgresql.resources | nindent 12 }}
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username }}
                - -d
                - {{ .Values.postgresql.auth.database }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 10
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - {{ .Values.postgresql.auth.username }}
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 5
        {{- if $walEnabled }}
        # WAL archiver sidecar: uploads archive_command segments to the backup
        # object store and removes them locally once uploaded. Exposes backup
        # metrics on the wal-metrics port for the backup PodMonitor.
        - name: wal-archive
          image: {{ include "collegehub.backup.image" . }}
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - wal-forward
            - --dir
            - {{ .Values.backup.postgres.wal.dir | default "/wal-archive" }}
            - --metrics-port
            - {{ .Values.backup.postgres.wal.metricsPort | default 9101 | quote }}
          ports:
            - name: wal-metrics
              containerPort: {{ .Values.backup.postgres.wal.metricsPort | default 9101 }}
              protocol: TCP
          env:
            {{- include "collegehub.backup.envVars" . | nindent 12 }}
          volumeMounts:
            - name: wal-archive
              mountPath: {{ .Values.backup.postgres.wal.dir | default "/wal-archive" }}
          resources:
            {{- toYaml .Values.backup.resources | nindent 12 }}
          securityContext:
            runAsNonRoot: true
            runAsUser: 1001
            runAsGroup: 1001
        {{- end }}
      volumes:
        {{- if $walEnabled }}
        # Staging area for WAL segments between archive_command and upload.
        # Segments are removed after a successful upload; a pod restart can
        # lose at most one un-archived segment (bounded by archive_timeout).
        - name: wal-archive
          emptyDir: {}
        {{- end }}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes:
          - ReadWriteOnce
        {{- if .Values.postgresql.storage.className }}
        storageClassName: {{ .Values.postgresql.storage.className }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.postgresql.storage.size }}
{{- end }}
