apiVersion: v1
kind: Secret
metadata:
  name: {{ include "collegehub.fullname" . }}-secret
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "collegehub.labels" . | nindent 4 }}
type: Opaque
stringData:
  {{- if .Values.secrets.databaseUrl }}
  DATABASE_URL: {{ .Values.secrets.databaseUrl | quote }}
  {{- else }}
  DATABASE_URL: {{ include "collegehub.postgresql.url" . | quote }}
  {{- end }}
  {{- if .Values.secrets.redisUrl }}
  REDIS_URL: {{ .Values.secrets.redisUrl | quote }}
  {{- else }}
  REDIS_URL: {{ include "collegehub.redis.url" . | quote }}
  {{- end }}
  {{- range $key, $value := .Values.secrets }}
  {{- if and (ne $key "databaseUrl") (ne $key "redisUrl") (ne $value "") }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
  {{- end }}
