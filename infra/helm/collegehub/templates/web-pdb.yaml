{{- if and .Values.web.enabled .Values.web.pdb.enabled }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ include "collegehub.fullname" . }}-web
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "collegehub.componentLabels" (dict "context" . "component" "web") | nindent 4 }}
spec:
  minAvailable: {{ .Values.web.pdb.minAvailable }}
  selector:
    matchLabels:
      {{- include "collegehub.componentSelectorLabels" (dict "context" . "component" "web") | nindent 6 }}
{{- end }}
