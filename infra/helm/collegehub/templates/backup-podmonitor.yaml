{{- if and .Values.backup.enabled .Values.postgresql.enabled .Values.backup.postgres.wal.enabled .Values.observability.podMonitor.enabled }}
---
# Scrapes the WAL archiver sidecar metrics (collegehub_backup_* + shared
# observability registry) from the bundled PostgreSQL pod.
apiVersion: monitoring.coreos.com/v1
kind: PodMonitor
metadata:
  name: {{ include "collegehub.fullname" . }}-backup-wal
  namespace: {{ .Values.global.namespace }}
  labels:
    {{- include "collegehub.componentLabels" (dict "context" . "component" "backup") | nindent 4 }}
    {{- with .Values.observability.podMonitor.labels }}
    {{- toYaml . | nindent 4 }}
    {{- end }}
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: postgres
      app.kubernetes.io/instance: {{ .Release.Name }}
  podMetricsEndpoints:
    - port: wal-metrics
      path: /metrics
      interval: 30s
{{- end }}
