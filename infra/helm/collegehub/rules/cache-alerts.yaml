apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: collegehub-cache
  namespace: {{ .Values.global.namespace | quote }}
  labels:
    app.kubernetes.io/name: collegehub
    app.kubernetes.io/part-of: collegehub-observability
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: collegehub-cache
      rules:
        - alert: CollegeHubCacheDown
          expr: |
            min(collegehub_cache_connected) by (service) == 0
          for: 2m
          labels:
            severity: critical
            team: platform
          annotations:
            summary: 'College Hub cache (Redis) unreachable'
            description: 'Service {{ $labels.service }} has lost connectivity to Redis for more than 2 minutes.'

        - alert: CollegeHubRedisErrorRateHigh
          expr: |
            sum(rate(collegehub_redis_errors_total[5m])) by (service)
              /
            clamp_min(sum(rate(collegehub_redis_commands_total[5m])) by (service), 1e-9) > 0.05
          for: 5m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'College Hub Redis command error rate above 5%'
            description: 'Service {{ $labels.service }} is failing {{ $value | humanizePercentage }} of Redis commands.'

        - alert: CollegeHubRedisCommandLatencyP99High
          expr: |
            histogram_quantile(0.99,
              sum(rate(collegehub_redis_command_duration_seconds_bucket[5m])) by (le, service)) > 0.1
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'College Hub Redis p99 command latency above 100ms'
            description: 'p99 Redis command latency for {{ $labels.service }} is {{ $value }}s.'
