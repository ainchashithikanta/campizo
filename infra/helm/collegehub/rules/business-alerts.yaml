apiVersion: monitoring.coreos.com/v1
kind: PrometheusRule
metadata:
  name: collegehub-business
  namespace: { { .Values.global.namespace | quote } }
  labels:
    app.kubernetes.io/name: collegehub
    app.kubernetes.io/part-of: collegehub-observability
    prometheus: k8s
    role: alert-rules
spec:
  groups:
    - name: collegehub-business
      rules:
        - alert: CollegeHubAuthLoginFailureSpike
          expr: |
            sum(rate(collegehub_auth_logins_total{result="failure"}[5m])) by (service)
              /
            clamp_min(sum(rate(collegehub_auth_logins_total[5m])) by (service), 1e-9) > 0.2
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'College Hub login failure ratio above 20%'
            description: '{{ $value | humanizePercentage }} of login attempts on {{ $labels.service }} are failing. Possible credential-stuffing attack or broken identity provider.'

        - alert: CollegeHubAuthRegistrationFailureSpike
          expr: |
            sum(rate(collegehub_auth_registrations_total{result="failure"}[5m])) by (service)
              /
            clamp_min(sum(rate(collegehub_auth_registrations_total[5m])) by (service), 1e-9) > 0.5
          for: 10m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'College Hub registration failure ratio above 50%'
            description: '{{ $value | humanizePercentage }} of registration attempts on {{ $labels.service }} are failing.'

        - alert: CollegeHubNotificationFailedRateHigh
          expr: |
            sum(rate(collegehub_notifications_total{action="failed"}[15m])) by (service) > 5
          for: 15m
          labels:
            severity: warning
            team: platform
          annotations:
            summary: 'College Hub notification failures climbing'
            description: 'Service {{ $labels.service }} is failing more than 5 notifications per second; check the email/push provider.'

        - alert: CollegeHubMarketplaceActivityPlunged
          expr: |
            absent(sum(rate(collegehub_marketplace_listings_total[30m])) by (service))
          for: 30m
          labels:
            severity: info
            team: platform
          annotations:
            summary: 'No marketplace listing activity detected'
            description: 'No `collegehub_marketplace_listings_total` samples for 30 minutes. The marketplace module may be misconfigured.'
