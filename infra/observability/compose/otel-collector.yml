# OpenTelemetry Collector config for the College Hub observability profile.
# Receives OTLP traces over gRPC (4317) and HTTP (4318) from the API/worker
# running on the host (default OTEL_EXPORTER_OTLP_ENDPOINT), batches them, and
# prints to stdout for local inspection. Swap the exporter for Jaeger/Zipkin or
# a vendor endpoint for richer trace UIs.
receivers:
  otlp:
    protocols:
      grpc:
        endpoint: 0.0.0.0:4317
      http:
        endpoint: 0.0.0.0:4318

processors:
  batch: {}

exporters:
  debug:
    verbosity: basic

service:
  pipelines:
    traces:
      receivers: [otlp]
      processors: [batch]
      exporters: [debug]
