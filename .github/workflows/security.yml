name: Security Audit & Compliance

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  schedule:
    - cron: '0 2 * * *' # Daily at 2 AM UTC

jobs:
  security-scan:
    name: Dependency Audit & Secret Scanning
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9.1.0

      - name: Setup Node.js (v20)
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'pnpm'

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      # -------------------------------------------------------------------
      # Dependency & vulnerability scan (REAL — fails the build on high/critical)
      # -------------------------------------------------------------------
      - name: Run MS-58 Security Audit Script
        run: node scripts/run-security-audit.js
        env:
          FAIL_ON_LEVEL: high

      # -------------------------------------------------------------------
      # TruffleHog secret scanning (git history + working tree)
      # -------------------------------------------------------------------
      - name: Download TruffleHog
        run: |
          curl -sSfL https://github.com/trufflesecurity/trufflehog/releases/download/v3.96.0/trufflehog_3.96.0_linux_amd64.tar.gz -o trufflehog.tar.gz
          tar -xzf trufflehog.tar.gz
          sudo mv trufflehog /usr/local/bin/trufflehog
          trufflehog --version

      - name: Secrets Scan
        run: |
          trufflehog git file://. --no-update --fail --only-verified

      - name: Generate Software Bill of Materials (SBOM)
        run: node scripts/generate-sbom.js

      - name: Upload Security Reports
        uses: actions/upload-artifact@v4
        with:
          name: security-sbom-report
          path: sbom-report.json
